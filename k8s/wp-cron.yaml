apiVersion: batch/v1
kind: CronJob
metadata:
  name: sleepplususa-wp-cron
  namespace: apps
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 120
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: wp-cron
              image: curlimages/curl:8.10.1
              args:
                - -fsS
                - --max-time
                - "60"
                - http://sleepplususa/wp-cron.php?doing_wp_cron
