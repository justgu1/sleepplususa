apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sleepplususa-tls
  namespace: apps
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`sleepplususa.net`) || Host(`www.sleepplususa.net`)
      kind: Rule
      services:
        - name: sleepplususa
          port: 80
  tls:
    certResolver: letsencrypt
